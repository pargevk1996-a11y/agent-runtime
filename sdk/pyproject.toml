[project]
name = "agent-runtime-sdk"
version = "0.1.0"
description = "Thin Python client SDK for the agent-runtime control plane."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime_sdk"]
